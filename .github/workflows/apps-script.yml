name: Apps Script

# Keeps the NCSSM YAC News Apps Script (apps-script/) in step with this
# repo, through YAC's shared deploy (ncssm-yac/yac-apps-script-deploy).
# GitHub is the only source of truth: nobody pastes code into the editor.
#
# - Pull request: tests only.
# - Merge to main touching apps-script/ (or Run workflow): tests, `clasp push`
#   to "NCSSM YAC News", then the drift check. Script Properties (DRY_RUN,
#   INBOX_FOLDER_ID, FORWARD_SENDERS) and the daily trigger are not code, so a
#   deploy never touches them.
# - Every day: drift check. Fails if the live code differs from the repo or
#   the clasp sign-in has stopped working.
#
# Secret: CLASPRC_JSON, the organization secret (see the shared repo's README).
on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/apps-script.yml']
  pull_request:
    paths: ['apps-script/**', '.github/workflows/apps-script.yml']
  schedule:
    - cron: '11 17 * * *' # daily drift check; any time of day is fine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ncssm-yac/yac-apps-script-deploy/.github/workflows/deploy.yml@main
    with:
      title: NCSSM YAC News
      src_dir: apps-script
      test_command: npm test
    secrets:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
